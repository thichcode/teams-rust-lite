[package]
name = "teams-rust-lite"
version = "0.1.1"
edition = "2021"
description = "Lightweight native Windows client for Microsoft Teams"
authors = ["Teams Rust Lite Authors"]

[dependencies]
slint = "1.9"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
keyring = { version = "3.2", features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
html2text = "0.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tray-icon = "0.19"
notify-rust = "4.11"
open = "5.3"
log = "0.4"
env_logger = "0.11"
url = "2.5"
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
urlencoding = "2.1"
html-escape = "0.2"

[build-dependencies]
slint-build = "1.9"
winres = "0.1"
