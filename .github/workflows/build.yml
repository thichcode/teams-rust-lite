name: Auto Build, Tag & Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'assets/**'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Tag & Release Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Determine Tag & Create Git Tag
        id: tagger
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          } else {
            # Extract version from Cargo.toml
            $cargoContent = Get-Content Cargo.toml -Raw
            if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
              $baseVersion = $matches[1]
            } else {
              $baseVersion = "0.1.0"
            }
            
            $tag = "v$baseVersion"
            # Check if this tag already exists on remote
            $exists = git ls-remote --tags origin "refs/tags/$tag"
            if ($exists) {
              $tag = "v$baseVersion-build.${{ github.run_number }}"
            }

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Automated release $tag for commit ${{ github.sha }}"
            git push origin $tag
          }

          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Target Release Tag: $tag"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-rust-lite-${{ env.RELEASE_TAG }}
          path: target/release/teams-rust-lite.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Teams Rust Lite ${{ env.RELEASE_TAG }}"
          files: target/release/teams-rust-lite.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
